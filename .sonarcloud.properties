# SonarCloud Automatic Analysis settings.
# Automatic Analysis reads this file (not sonar-project.properties) and cannot import a coverage report.
# If the project moves to CI-based analysis, move these settings to sonar-project.properties and add
# sonar.python.coverage.reportPaths=coverage.xml (see [tool.coverage.run] in pyproject.toml).

# Same as requires-python in pyproject.toml.
sonar.python.version=3.14

# Production code and test code. Keep the test patterns in sync with python_files and
# [tool.coverage.run] omit in pyproject.toml.
sonar.sources=.
sonar.exclusions=**/migrations/**,**/tests.py,**/test_*.py,**/*_tests.py,**/testing/**
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_tests.py,**/testing/**
