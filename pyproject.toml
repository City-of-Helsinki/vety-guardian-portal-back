[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.format]
exclude = ["*/migrations/*.py"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012", "I001"]
"*/serializers.py" = ["RUF012"]
"*/models.py" = ["RUF012"]
"*/views.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

# Coverage for SonarCloud: uv run pytest --cov --cov-report=xml (writes coverage.xml).
# Keep the omitted files in sync with sonar-project.properties.
[tool.coverage.run]
source = ["."]
branch = true
relative_files = true
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "*/*_tests.py",
    "*/testing/*",
    "manage.py",
    "core/asgi.py",
    "core/wsgi.py",
]

[project]
name = "vety-guardian-portal-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-helusers>=1.3.0",
    "django-logger-extra>=1.3.1",
    "django-resilient-logger>=3.1.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-camel-case>=1.4.2",
    "drf-spectacular>=0.30.0",
    "helsinki-profile-gdpr-api>=1.1.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.3.5",
    "requests>=2.34.2",
    "sentry-sdk>=2.74.0",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.413",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]
prod = [
    "uwsgi>=2.0.31",
]
