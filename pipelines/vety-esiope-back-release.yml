# Continuous integration (CI) triggers cause a pipeline to run whenever you push
# an update to the specified branches or you push specified tags.
trigger:
  batch: true
  tags:
    include:
      - vety-esiope-back-wordpress-theme-v*

# Pull request (PR) triggers cause a pipeline to run whenever a pull request is
# opened with one of the specified target branches, or when updates are made to
# such a pull request.
#
# GitHub creates a new ref when a pull request is created. The ref points to a
# merge commit, which is the merged code between the source and target branches
# of the pull request.
#
# Opt out of pull request validation
pr: none

# By default, use self-hosted agents
pool: Default

resources:
  repositories:
    # Azure DevOps repository
    - repository: vety-esiope-pipelines
      type: git
      # Azure DevOps project/repository
      name: vety-esiope/vety-esiope-pipelines

extends:
  # Filename in Azure DevOps Repository
  template: components/vety-esiope-back/pipelines/vety-esiope-back-release.yml@vety-esiope-pipelines
  parameters:
    # Application build arguments and config map values as key value pairs.
    # Does not contain all buildArguments or configMap values, the rest located in vety-esiope-back-pipelines
    # The values here will override the values defined in the vety-esiope-back-pipelines repository
    ## Staging definitions
    configMapStage: # pod environment variables
      DEBUG: "0"
      APPLY_MIGRATIONS: "1"
      VTJ_HEL_TIMEOUT: "10"
      VETY_LOG_LEVEL: "INFO"
      DJANGO_LOG_LEVEL: "WARNING"
      ROOT_LOG_LEVEL: "WARNING"
      # Environment specific, fill in actual values:
      # ALLOWED_HOSTS: ""
      # CORS_ALLOWED_ORIGINS: ""
      # CSRF_TRUSTED_ORIGINS: ""
      # VTJ_HEL_ENDPOINT: ""
      # VTJ_HEL_SHARED_SECRET_HEADER: ""
      # Secrets (SECRET_KEY, DB_PASSWORD, VTJ_HEL_SHARED_SECRET) must not be defined here
    ## Production definitions
    ## Production is using staging image
    configMap: # pod environment variables
      DEBUG: "0"
      APPLY_MIGRATIONS: "1"
      VTJ_HEL_TIMEOUT: "10"
      VETY_LOG_LEVEL: "INFO"
      DJANGO_LOG_LEVEL: "WARNING"
      ROOT_LOG_LEVEL: "WARNING"
      # Environment specific, fill in actual values:
      # ALLOWED_HOSTS: ""
      # CORS_ALLOWED_ORIGINS: ""
      # CSRF_TRUSTED_ORIGINS: ""
      # VTJ_HEL_ENDPOINT: ""
      # VTJ_HEL_SHARED_SECRET_HEADER: ""
      # Secrets (SECRET_KEY, DB_PASSWORD, VTJ_HEL_SHARED_SECRET) must not be defined here
