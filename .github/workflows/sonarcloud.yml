name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vetyuser
          POSTGRES_PASSWORD: vetypw
          POSTGRES_DB: vetyguardiandb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "off"
      DATABASE_URL: postgres://vetyuser:vetypw@localhost:5432/vetyguardiandb
      VTJ_HEL_ENDPOINT: http://localhost:8080/api/HenkilonTunnuskysely

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarCloud can assign new code and blame correctly.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
