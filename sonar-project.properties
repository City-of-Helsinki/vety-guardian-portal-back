# SonarCloud CI-based analysis settings, used by .github/workflows/sonarcloud.yml.
# Automatic Analysis must be turned off in SonarCloud (Administration > Analysis Method), otherwise the CI scan fails.
sonar.organization=city-of-helsinki
sonar.projectKey=City-of-Helsinki_vety-guardian-portal-back

# Same as requires-python in pyproject.toml.
sonar.python.version=3.14

# Production code and test code. Keep the test patterns in sync with python_files and
# [tool.coverage.run] omit in pyproject.toml.
sonar.sources=.
sonar.exclusions=**/migrations/**,**/tests.py,**/test_*.py,**/*_tests.py,**/testing/**
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_tests.py,**/testing/**

# Written by: uv run pytest --cov --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
